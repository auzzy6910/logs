{% extends "shop/base_with_sidebar.html" %}
{% block title %}Top Up | DigitalShop{% endblock %}

{% block main_content %}
<h1 class="page-title">Top Up</h1>

<div class="topup-notice">
    <h5>Attention</h5>
    <p>Add funds to your account balance to purchase digital products. Your balance will be updated instantly.</p>
    <a href="{% url 'transactions' %}" style="color: #FF6B00;">Track your payments</a>
</div>

<div class="topup-form">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="amount" class="form-label">Amount ($)</label>
            <input type="number" step="0.01" min="1" max="10000" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-primary">Top up</button>
        </div>
    </form>
</div>
{% endblock %}
